<title>STEP Foundation & Training Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=Tajawal:wght@300;400;500;700;900&family=Literata:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF2F8; --surface:#FFFFFF; --surface-alt:#E4EAF3; --border:#D2DCEA;
  --ink:#132038; --ink-soft:#4C5A75; --ink-faint:#7C8AA4;
  --accent:#B9832A; --accent-ink:#6B4A16; --accent-soft:#F3E3C4;
  --teal:#166F62; --teal-soft:#DCEFEA; --teal-ink:#0E4A41;
  --danger:#AF3A4E; --danger-soft:#F6DEE3; --danger-ink:#7A2536;
  --shadow:0 1px 2px rgba(19,32,56,.06),0 10px 28px -14px rgba(19,32,56,.22);
  --r-s:10px; --r-m:16px; --r-l:24px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1420; --surface:#141D2C; --surface-alt:#1C2739; --border:#2A374C;
    --ink:#E9EFF9; --ink-soft:#AEBCD4; --ink-faint:#8394AF;
    --accent:#E7B856; --accent-ink:#3B2B0C; --accent-soft:#3A2E15;
    --teal:#4FC0A9; --teal-soft:#103A33; --teal-ink:#BEEEE2;
    --danger:#E27488; --danger-soft:#3B1D24; --danger-ink:#F6D3DA;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 32px -16px rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1420; --surface:#141D2C; --surface-alt:#1C2739; --border:#2A374C;
  --ink:#E9EFF9; --ink-soft:#AEBCD4; --ink-faint:#8394AF;
  --accent:#E7B856; --accent-ink:#3B2B0C; --accent-soft:#3A2E15;
  --teal:#4FC0A9; --teal-soft:#103A33; --teal-ink:#BEEEE2;
  --danger:#E27488; --danger-soft:#3B1D24; --danger-ink:#F6D3DA;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 32px -16px rgba(0,0,0,.65);
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',sans-serif;direction:ltr;line-height:1.6;}
h1,h2,h3,h4{font-family:'Cairo',sans-serif;text-wrap:balance;margin:0 0 6px;color:var(--ink);}
p{margin:0 0 10px;}
button{font-family:inherit;cursor:pointer;}
.en{font-family:'Literata',serif;direction:ltr;text-align:left;unicode-bidi:isolate;}
.mono{font-family:'IBM Plex Mono',monospace;direction:ltr;unicode-bidi:isolate;}
::selection{background:var(--accent-soft);}
a{color:var(--teal);}

.topbar{display:flex;align-items:center;gap:16px;padding:14px clamp(14px,3vw,32px);background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:12px;flex:1 1 260px;min-width:0;}
.brand-badge{width:44px;height:44px;border-radius:12px;background:linear-gradient(155deg,var(--accent),var(--teal));display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Cairo';font-weight:900;font-size:18px;flex:0 0 auto;box-shadow:var(--shadow);}
.brand-text h1{font-size:17px;margin:0;font-family:'Cairo','Tajawal',sans-serif;}
.brand-text span{font-size:12.5px;color:var(--ink-faint);}
.bi-en{display:block;font-size:11.5px;color:var(--ink-faint);font-weight:500;font-family:'Tajawal',sans-serif;direction:ltr;text-align:left;}
h1 .bi-en{font-size:12px;margin-top:1px;}
.bi-ar{font-family:'Cairo','Tajawal',sans-serif;}
.topbar-meta{display:flex;align-items:center;gap:18px;margin-inline-start:auto;flex:0 0 auto;}
.progress-ring-wrap{display:flex;align-items:center;gap:10px;}
.progress-ring-wrap .num{font-family:'Cairo';font-weight:800;font-size:15px;}
.progress-ring-wrap .lbl{font-size:11.5px;color:var(--ink-faint);}
.theme-btn{border:1px solid var(--border);background:var(--surface-alt);color:var(--ink-soft);width:36px;height:36px;border-radius:50%;font-size:15px;display:flex;align-items:center;justify-content:center;}

html{direction:ltr;}
.app{display:flex;flex-direction:row;direction:ltr;align-items:flex-start;}
.navrail{width:216px;flex:0 0 auto;position:sticky;top:65px;height:calc(100vh - 65px);overflow-y:auto;background:var(--surface);border-right:1px solid var(--border);padding:18px 12px;display:flex;flex-direction:column;gap:4px;}
.navbtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-s);border:1px solid transparent;background:transparent;color:var(--ink-soft);text-align:start;font-size:14.5px;font-weight:500;width:100%;}
.navbtn .ic{font-size:17px;width:22px;text-align:center;flex:0 0 auto;}
.navbtn:hover{background:var(--surface-alt);}
.navbtn.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:700;border-color:color-mix(in srgb, var(--accent) 35%, transparent);}
.nav-hours{margin-inline-start:auto;font-size:11px;font-family:'IBM Plex Mono';color:var(--ink-faint);}
.navbtn.active .nav-hours{color:var(--accent-ink);}

main{flex:1;min-width:0;padding:26px clamp(14px,3.4vw,40px) 70px;max-width:980px;margin:0 auto;}
[hidden]{display:none!important;}

.hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);padding:26px clamp(18px,4vw,34px);box-shadow:var(--shadow);margin-bottom:22px;position:relative;overflow:hidden;}
.hero::before{content:"";position:absolute;inset-inline-end:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,var(--accent-soft),transparent 70%);}
.hero h2{font-size:23px;}
.hero .sub{color:var(--ink-soft);font-size:14.5px;max-width:60ch;}
.hero-h2-en{font-size:16px;font-weight:600;color:var(--ink-soft);margin-top:3px;}
.hero .sub .bi-en{font-size:14px;color:var(--ink-soft);margin-top:6px;font-weight:400;}
.hero-stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
.stat-chip{background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--r-s);padding:9px 14px;font-size:13px;color:var(--ink-soft);display:flex;gap:6px;align-items:baseline;}
.stat-chip b{font-family:'Cairo';font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums;}

.section-title{display:flex;align-items:baseline;gap:10px;margin:28px 0 14px;}
.section-title h3{font-size:18px;}
.section-title .cnt{font-size:12.5px;color:var(--ink-faint);font-family:'IBM Plex Mono';}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);box-shadow:var(--shadow);}
.session-list{display:flex;flex-direction:column;gap:0;border-radius:var(--r-m);overflow:hidden;border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow);}
.session-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border);}
.session-row:last-child{border-bottom:none;}
.session-row.done{background:color-mix(in srgb, var(--teal-soft) 55%, transparent);}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--ink-faint);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;background:transparent;}
.session-row.done .chk{background:var(--teal);border-color:var(--teal);}
.session-row .mod{font-size:11px;color:var(--accent-ink);background:var(--accent-soft);padding:2px 8px;border-radius:20px;font-weight:700;flex:0 0 auto;}
.session-row .ttl{flex:1;min-width:0;font-size:14.5px;font-weight:500;}
.session-row .hrs{font-family:'IBM Plex Mono';font-size:12px;color:var(--ink-faint);flex:0 0 auto;}
.session-row button{background:none;border:none;flex:1;text-align:start;display:flex;align-items:center;gap:12px;padding:0;color:inherit;}

.tabbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
.tabbtn{background:var(--surface);border:1px solid var(--border);color:var(--ink-soft);padding:8px 16px;border-radius:20px;font-size:13.5px;font-weight:600;}
.tabbtn.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}

.acc-item{border:1px solid var(--border);border-radius:var(--r-m);margin-bottom:10px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow);}
.acc-head{display:flex;align-items:center;gap:10px;padding:12px 16px;color:var(--ink);}
.acc-toggle{display:flex;align-items:center;gap:12px;background:none;border:none;flex:1;min-width:0;text-align:start;color:inherit;padding:6px 0;font:inherit;}
.acc-head .n{font-family:'IBM Plex Mono';font-size:12px;color:var(--accent-ink);background:var(--accent-soft);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.acc-head .t{font-weight:700;font-size:15px;flex:1;}
.acc-head .arrow{transition:transform .25s;color:var(--ink-faint);flex:0 0 auto;}
.spk-inline{flex:0 0 auto;background:var(--teal-soft);color:var(--teal-ink);border:1px solid var(--border);border-radius:50%;width:34px;height:34px;font-size:14px;display:flex;align-items:center;justify-content:center;}
.spk-inline:hover{border-color:var(--teal);}
.spk-mini{position:absolute;top:10px;inset-inline-end:10px;background:var(--surface);border:1px solid var(--border);border-radius:50%;width:32px;height:32px;font-size:13px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);z-index:2;}
.tts-btn.small{padding:6px 14px;font-size:12px;}
.acc-item.open .arrow{transform:rotate(180deg);}
.acc-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
.acc-item.open .acc-body{max-height:2000px;}
.acc-body-inner{padding:0 18px 18px;border-top:1px solid var(--border);padding-top:14px;}
.rule-box{background:var(--surface-alt);border-radius:var(--r-s);padding:12px 14px;margin-bottom:10px;font-size:14px;}
.rule-box b{color:var(--teal-ink);}
.ex-list{display:flex;flex-direction:column;gap:7px;margin-top:8px;}
.ex-item{position:relative;background:var(--surface-alt);border-radius:var(--r-s);padding-block:9px;padding-inline-start:12px;padding-inline-end:44px;font-size:14px;}
.ex-item .en{color:var(--ink);}
table{border-collapse:collapse;width:100%;font-size:13.5px;}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-m);background:var(--surface);box-shadow:var(--shadow);}
th,td{padding:9px 12px;border-bottom:1px solid var(--border);text-align:start;white-space:nowrap;}
th{background:var(--surface-alt);font-family:'Cairo';font-size:12.5px;color:var(--ink-soft);position:sticky;top:0;}
tr:last-child td{border-bottom:none;}
.spk-row{cursor:pointer;}
.spk-row:hover td{background:var(--surface-alt);}
td.en{white-space:nowrap;}

.passage-grid{display:flex;flex-direction:column;gap:10px;}
.p-card{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);box-shadow:var(--shadow);}
.p-card button{background:none;border:none;padding:0;flex:1;display:flex;align-items:center;gap:14px;text-align:start;color:inherit;}
.p-num{width:38px;height:38px;border-radius:12px;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;font-family:'Cairo';font-weight:800;color:var(--ink-soft);flex:0 0 auto;}
.p-info{flex:1;min-width:0;}
.p-info .ttl{font-weight:700;font-size:15px;}
.p-info .meta{font-size:12px;color:var(--ink-faint);}
.tag{display:inline-block;background:var(--teal-soft);color:var(--teal-ink);border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;margin-inline-end:6px;}

.reader-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);box-shadow:var(--shadow);padding:22px clamp(16px,3vw,28px);margin-bottom:18px;}
.reader-box .passage-text{font-size:16px;line-height:1.85;margin-top:12px;padding-top:14px;border-top:1px dashed var(--border);}
.back-btn{background:var(--surface-alt);border:1px solid var(--border);border-radius:20px;padding:7px 16px;font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:16px;}
.tts-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;}
.tts-btn{background:var(--teal);color:#fff;border:none;border-radius:20px;padding:8px 18px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;}
.tts-btn.stop{background:var(--danger);}
.tts-btn[disabled]{opacity:.5;cursor:not-allowed;}
.rate-btn{background:var(--surface-alt);border:1px solid var(--border);border-radius:20px;padding:7px 12px;font-size:12.5px;color:var(--ink-soft);font-family:'IBM Plex Mono';}
.rate-btn.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}

.quiz-wrap{display:flex;flex-direction:column;gap:14px;}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-faint);font-family:'IBM Plex Mono';}
.quiz-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);box-shadow:var(--shadow);padding:20px clamp(16px,3vw,26px);}
.quiz-q{font-size:16.5px;font-weight:600;margin-bottom:16px;}
.quiz-opts{display:flex;flex-direction:column;gap:9px;}
.opt-btn{display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface-alt);border:1.5px solid var(--border);border-radius:var(--r-s);padding:11px 14px;font-size:14.5px;color:var(--ink);direction:ltr;}
.opt-btn .k{font-family:'IBM Plex Mono';font-weight:700;color:var(--ink-faint);flex:0 0 auto;}
.opt-btn:hover:not([disabled]){border-color:var(--accent);}
.opt-btn.correct{background:var(--teal-soft);border-color:var(--teal);color:var(--teal-ink);}
.opt-btn.wrong{background:var(--danger-soft);border-color:var(--danger);color:var(--danger-ink);}
.opt-btn[disabled]{cursor:default;}
.explain-box{margin-top:14px;background:var(--surface-alt);border-inline-start:4px solid var(--accent);border-radius:8px;padding:11px 14px;font-size:13.8px;display:none;}
.explain-box.show{display:block;}
.quiz-nav{display:flex;justify-content:space-between;align-items:center;}
.btn{background:var(--ink);color:var(--bg);border:none;border-radius:20px;padding:10px 22px;font-size:14px;font-weight:700;}
.btn.ghost{background:var(--surface-alt);color:var(--ink-soft);border:1px solid var(--border);}
.btn[disabled]{opacity:.4;cursor:not-allowed;}
.score-screen{text-align:center;padding:34px 16px;}
.score-num{font-family:'Cairo';font-weight:900;font-size:52px;background:linear-gradient(135deg,var(--accent),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1;}
.quiz-setup{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:16px;}
.choice-row{display:flex;gap:8px;flex-wrap:wrap;}
.choice-btn{background:var(--surface-alt);border:1.5px solid var(--border);border-radius:20px;padding:8px 16px;font-size:13.5px;color:var(--ink-soft);font-weight:600;}
.choice-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);}

.deck-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px;}
.deck-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-m);padding:16px;text-align:center;box-shadow:var(--shadow);}
.deck-card b{display:block;font-family:'Cairo';font-size:14.5px;margin-bottom:4px;}
.deck-card span{font-size:12px;color:var(--ink-faint);}
.deck-card.active{border-color:var(--accent);background:var(--accent-soft);}
.flash-stage{display:flex;flex-direction:column;align-items:center;gap:16px;}
.flash-progress{font-family:'IBM Plex Mono';font-size:12.5px;color:var(--ink-faint);}
.flashcard{width:100%;max-width:440px;height:230px;perspective:1200px;}
.flashcard-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer;}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r-l);border:1px solid var(--border);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;gap:8px;background:var(--surface);}
.face.back{transform:rotateY(180deg);background:var(--accent-soft);}
.face .word{font-family:'Literata';font-size:26px;font-weight:600;direction:ltr;}
.face .hint{font-size:12px;color:var(--ink-faint);}
.face .mean{font-family:'Cairo';font-size:22px;font-weight:800;color:var(--accent-ink);}
.face .note{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
.flash-actions{display:flex;gap:10px;}
.fbtn{border:none;border-radius:20px;padding:11px 20px;font-size:13.5px;font-weight:700;}
.fbtn.know{background:var(--teal);color:#fff;}
.fbtn.again{background:var(--surface-alt);color:var(--ink-soft);border:1px solid var(--border);}

.footer-note{text-align:center;color:var(--ink-faint);font-size:12px;margin-top:40px;padding-top:16px;border-top:1px solid var(--border);}

@media (max-width:820px){
  .navrail{position:fixed;bottom:0;top:auto;right:0;left:0;width:100%;height:auto;flex-direction:row;overflow-x:auto;border-right:none;border-top:1px solid var(--border);padding:8px 10px;z-index:40;gap:6px;}
  .navbtn{flex-direction:column;gap:2px;padding:6px 10px;font-size:10.5px;white-space:nowrap;}
  .navbtn .ic{font-size:18px;}
  .nav-hours{display:none;}
  main{padding-bottom:90px;}
  .app{display:block;}
}
</style>

<div class="topbar" dir="ltr">
  <div class="brand">
    <div class="brand-badge">S</div>
    <div class="brand-text">
      <h1 class="bi-ar" dir="rtl">دورة تأسيسية وتدريبية لاختبار STEP<span class="bi-en">STEP Foundation &amp; Training Course</span></h1>
      <span class="bi-ar" dir="rtl">عبدالعزيز سعيد المحمادي - الثانوية المركزية بالظهران - 30 ساعة تدريبية<span class="bi-en">Mr. Abdulaziz Saeed Al-Mohammadi - Dhahran Central Secondary School - 30 Training Hours</span></span>
    </div>
  </div>
  <div class="topbar-meta">
    <div class="progress-ring-wrap">
      <svg width="46" height="46" viewBox="0 0 46 46">
        <circle cx="23" cy="23" r="19" fill="none" stroke="var(--surface-alt)" stroke-width="5"></circle>
        <circle id="ringFg" cx="23" cy="23" r="19" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="119.4" transform="rotate(-90 23 23)"></circle>
      </svg>
      <div>
        <div class="num"><span id="ringPct">0</span>%</div>
        <div class="lbl">Overall Progress</div>
      </div>
    </div>
    <button class="theme-btn" id="themeBtn" title="Toggle theme">◐</button>
  </div>
</div>

<div class="app" dir="ltr">
  <nav class="navrail" id="navrail" dir="ltr" lang="en"></nav>
  <main id="main" dir="ltr"></main>
</div>

<script>
document.documentElement.setAttribute('dir','ltr');
document.documentElement.setAttribute('lang','en');
/* ============ DATA ============ */
const CURRICULUM = [

 {id:10,h:1,mod:'Reading',t:'Reading Strategies',tab:'reading'},
 {id:11,h:2,mod:'Reading',t:'Reading Practice: Passages 1 – 3',tab:'reading'},
 {id:12,h:2,mod:'Reading',t:'Reading Practice: Passages 4 – 6',tab:'reading'},
 {id:13,h:2,mod:'Reading',t:'Reading Practice: Passages 7 – 10',tab:'reading'},
 {id:14,h:1,mod:'Reading',t:'Comprehensive Reading Test',tab:'reading'},
 {id:15,h:1,mod:'Listening',t:'Listening Strategies',tab:'listening'},
 {id:16,h:2,mod:'Listening',t:'Dialogues & Lectures 1 – 5',tab:'listening'},
 {id:17,h:2,mod:'Listening',t:'Dialogues & Lectures 6 – 10',tab:'listening'},
 {id:18,h:1.5,mod:'Vocabulary',t:'STEP Synonyms & Academic Word List',tab:'vocab'},

function updateRing(){
  const doneHours = CURRICULUM.filter(c=>state.done.has(c.id)).reduce((s,c)=>s+c.h,0);
  const pct = Math.round((doneHours/TOTAL_HOURS)*100);
  const circumference = 2*Math.PI*19;
  document.getElementById('ringFg').style.strokeDasharray = circumference.toFixed(1);

  document.getElementById('ringPct').textContent = pct;
}

/* ============ TTS ============ */
let ttsRate = 0.9;
function enVoices(){
  return window.speechSynthesis.getVoices().filter(v=>v.lang && v.lang.toLowerCase().startsWith('en'));
}
function speak(text, btn){
  if(!('speechSynthesis' in window)){ alert('Your browser does not support text-to-speech.'); return; }
  window.speechSynthesis.cancel();
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const dialoguePattern = /^([A-Z]):\s*(.+)$/;
  const isDialogue = lines.length>1 && lines.every(l=>dialoguePattern.test(l));
  const voices = enVoices();
  if(isDialogue){
    const voiceA = voices[0];
    const voiceB = voices[1] || voices[0];
    lines.forEach(line=>{
      const m = line.match(dialoguePattern);
      const u = new SpeechSynthesisUtterance(m[2]);
      u.lang='en-US'; u.rate=ttsRate;
      if(m[1]==='A'){ if(voiceA) u.voice=voiceA; u.pitch=1; }
      else { if(voiceB) u.voice=voiceB; u.pitch = (voiceB===voiceA)?1.4:1; }
      window.speechSynthesis.speak(u);
    });
  } else {
    const u = new SpeechSynthesisUtterance(text.replace(/\n/g,'. '));
    u.lang='en-US'; u.rate=ttsRate;
    if(voices[0]) u.voice = voices[0];
    window.speechSynthesis.speak(u);
  }
}

function renderVocab(main){

  main.innerHTML = `

  grid.innerHTML = Object.keys(VOCAB_DECKS).map(k=>{
    const d=VOCAB_DECKS[k];
    const masteredCount = d.items.filter((_,i)=>state.mastered.has(k+'_'+i)).length;
    return `<div class="deck-card ${deckKey===k?'active':''}" data-k="${k}"><b>${d.name}</b><span>${masteredCount}/${d.items.length} Mastered</span></div>`;
  }).join('');

function renderFlashcard(host, deckKey){
  const deck = VOCAB_DECKS[deckKey];
  if(state.cardIdx==null) state.cardIdx=0;
  if(state.cardIdx>=deck.items.length) state.cardIdx=0;
  const item = deck.items[state.cardIdx];
  const key = deckKey+'_'+state.cardIdx;
  host.innerHTML = `
  <div class="flash-stage">
    <div class="flash-progress">Card ${state.cardIdx+1} of ${deck.items.length} ${state.mastered.has(key)?'· ✓ Mastered':''}</div>
    <div class="flashcard" id="fc">
      <div class="flashcard-inner">
        <div class="face front"><button class="spk-mini" id="fcSpeak" title="Pronounce word">🔊</button><span class="hint">Tap to Show Answer</span><span class="word">${item[0]}</span></div>
        <div class="face back"><button class="spk-mini" id="fcSpeakBack" title="Pronounce word">🔊</button><span class="mean en">${item[1]}</span></div>
      </div>
    </div>
    <div class="flash-actions">
      <button class="fbtn again" id="againBtn">🔁 Need Review</button>
      <button class="fbtn know" id="knowBtn">✅ Mastered</button>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn ghost" id="prevBtn">Previous</button>
      <button class="btn ghost" id="shuffleBtn">🔀 Random</button>
      <button class="btn ghost" id="nextBtn">Next</button>
    </div>
  </div>`;
  const fc = document.getElementById('fc');
  fc.onclick=()=>fc.classList.toggle('flipped');
  document.getElementById('fcSpeak').onclick=(e)=>{e.stopPropagation(); speak(item[0]+'. '+item[1]);};
  document.getElementById('fcSpeakBack').onclick=(e)=>{e.stopPropagation(); speak(item[0]);};
  document.getElementById('knowBtn').onclick=()=>{state.mastered.add(key); saveFlash(); nextCard(deck);};
  document.getElementById('againBtn').onclick=()=>{state.mastered.delete(key); saveFlash(); nextCard(deck);};
  document.getElementById('nextBtn').onclick=()=>nextCard(deck);
  document.getElementById('prevBtn').onclick=()=>{state.cardIdx=(state.cardIdx-1+deck.items.length)%deck.items.length; render();};
  document.getElementById('shuffleBtn').onclick=()=>{state.cardIdx=Math.floor(Math.random()*deck.items.length); render();};
  function nextCard(deck){ state.cardIdx=(state.cardIdx+1)%deck.items.length; render(); }
}

function renderQuiz(main){

    </ul></div>`;

function renderQuizSetup(host, pool, title, hasCats){
  let selectedCat = 'All';
  let selectedN = 10;
  const cats = hasCats ? ['All', ...new Set(pool.map(q=>CAT_LABELS[q.cat]||q.cat))] : ['All','Grammar','Vocabulary','Reading'];
  function draw(){
    host.innerHTML = `
    <div class="quiz-setup">
      <h4 style="margin:0;">${title}</h4>
      <div>
        <div style="font-size:12.5px;color:var(--ink-faint);margin-bottom:6px;">Category</div>
        <div class="choice-row" id="catRow">${cats.map(c=>`<button class="choice-btn ${c===selectedCat?'active':''}" data-c="${c}">${c}</button>`).join('')}</div>
      </div>
      <div>
        <div style="font-size:12.5px;color:var(--ink-faint);margin-bottom:6px;">Number of Questions</div>
        <div class="choice-row" id="nRow">${[5,10,20,'All'].map(n=>`<button class="choice-btn ${n===selectedN?'active':''}" data-n="${n}">${n}</button>`).join('')}</div>
      </div>
      <button class="btn" id="startQuizBtn" style="align-self:flex-start;">Start Test</button>
    </div>
    <div id="quizRunHost"></div>`;
    host.querySelector('#catRow').querySelectorAll('button').forEach(b=>b.onclick=()=>{selectedCat=b.dataset.c; draw();});
    host.querySelector('#nRow').querySelectorAll('button').forEach(b=>b.onclick=()=>{selectedN=isNaN(b.dataset.n)?b.dataset.n:Number(b.dataset.n); draw();});
    host.querySelector('#startQuizBtn').onclick=()=>{
      let filtered = pool;
      if(selectedCat!=='All') filtered = pool.filter(q=>(hasCats?CAT_LABELS[q.cat]||q.cat:q.cat)===selectedCat);
      filtered = [...filtered].sort(()=>Math.random()-0.5);
      if(selectedN!=='All') filtered = filtered.slice(0, selectedN);
      runQuiz(document.getElementById('quizRunHost'), filtered, title);
    };
  }
  draw();
}

function runQuiz(host, questions, title){
  if(!questions.length){ host.innerHTML=''; return; }
  let idx=0, score=0, answered=false;
  function draw(){
    if(idx>=questions.length){
      host.innerHTML = `<div class="quiz-card score-screen">
        <div class="score-num">${score}/${questions.length}</div>
        <p style="margin-top:10px;color:var(--ink-soft);">Your score in "${title}"</p>
        <button class="btn" id="retryBtn">Retry</button>
      </div>`;
      host.querySelector('#retryBtn').onclick=()=>{idx=0;score=0;draw();};
      return;
    }
    const q = questions[idx];
    host.innerHTML = `
    <div class="quiz-wrap">
      <div class="quiz-meta"><span>Question ${idx+1} of ${questions.length}</span><span>Score: ${score}</span></div>
      <div class="quiz-card">
        <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:16px;">
          <div class="quiz-q en" style="margin-bottom:0;flex:1;">${q.q}</div>
          <button class="spk-inline" id="qSpeak" title="Listen to the question and options" style="width:32px;height:32px;font-size:13px;">🔊</button>
        </div>
        <div class="quiz-opts">${q.o.map((op,i)=>`<button class="opt-btn" data-i="${i}"><span class="k">${String.fromCharCode(65+i)}</span><span>${op}</span></button>`).join('')}</div>
        <div class="explain-box" id="explainBox"></div>
        <div class="quiz-nav" style="margin-top:16px;">
          <button class="btn ghost" id="skipBtn">Skip</button>
          <button class="btn" id="nextQBtn" disabled>Next</button>
        </div>
      </div>
    </div>`;
    document.getElementById('qSpeak').onclick=()=>speak(q.q+'. '+q.o.map((op,i)=>String.fromCharCode(65+i)+'. '+op).join('. '));
    answered=false;
    host.querySelectorAll('.opt-btn').forEach(b=>b.onclick=()=>{
      if(answered) return; answered=true;
      const i=Number(b.dataset.i);
      host.querySelectorAll('.opt-btn').forEach(x=>x.disabled=true);
      if(i===q.a){ b.classList.add('correct'); score++; }
      else { b.classList.add('wrong'); host.querySelectorAll('.opt-btn')[q.a].classList.add('correct'); }
      const eb=document.getElementById('explainBox');
      eb.textContent = q.e || '';
      eb.classList.add('show');
      document.getElementById('nextQBtn').disabled=false;
    });
    host.querySelector('#skipBtn').onclick=()=>{idx++; draw();};
    host.querySelector('#nextQBtn').onclick=()=>{idx++; draw();};
  }
  draw();
}

document.getElementById('themeBtn').onclick=()=>{
  const cur = root.getAttribute('data-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const curEffective = cur || (prefersDark?'dark':'light');
  applyTheme(curEffective==='dark'?'light':'dark');
};

render();
